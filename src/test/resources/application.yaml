# $schema=invalid-url
spring:
  config:
    import: "optional:file:.env.test[.properties]"
  logging:
    root: DEBUG
    file:
      name: .\logs\certificate-emitter.log
    level:
      org.springframework.mail: DEBUG
      com.sun.mail: DEBUG
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # JPA
  jpa:
    database: POSTGRESQL
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
    hibernate:
      ddl-auto: validate
    show-sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        debug: true
        smtp:
          auth: true
          connectiontimeout: 5000
          ssl:
            trust: ${MAIL_HOST}
          starttls:
            enable: true
          timeout: 5000
          writetimeout: 5000
  sql:
    init:
      mode: never

google:
  credentialsPath: /credentials.json

evaluation:
  minApproval: 75

local:
  temp: .\tmp\

gotenberg:
  base-url: ${GOTENBERG_BASE_URL:http://localhost:3000}

# Server
server:
  port: 8080

  # Swagger
  springdoc:
    swagger-ui:
      operations-sorter: alpha
