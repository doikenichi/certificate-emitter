<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">

  <!-- Bootstrap CSS -->
  <link crossorigin="anonymous" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" rel="stylesheet">
  <!-- Font Awesome icons (free version)-->
  <script crossorigin="anonymous" src="https://use.fontawesome.com/releases/v5.13.0/js/all.js"></script>
  <!-- Google fonts-->
  <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css"/>
  <link href="https://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic" rel="stylesheet"
        type="text/css"/><!-- Font Awesome icons (free version)-->
  <link rel="stylesheet" th:href="@{/css/main.css}"/>
  <!-- Favicon-->
  <link rel="apple-touch-icon" sizes="57x57" th:href="@{/img/apple-icon-57x57.png}">
  <link rel="apple-touch-icon" sizes="60x60" th:href="@{/img/apple-icon-60x60.png}">
  <link rel="apple-touch-icon" sizes="72x72" th:href="@{/img/apple-icon-72x72.png}">
  <link rel="apple-touch-icon" sizes="76x76" th:href="@{/img/apple-icon-76x76.png}">
  <link rel="apple-touch-icon" sizes="114x114" th:href="@{/img/apple-icon-114x114.png}">
  <link rel="apple-touch-icon" sizes="120x120" th:href="@{/img/apple-icon-120x120.png}">
  <link rel="apple-touch-icon" sizes="144x144" th:href="@{/img/apple-icon-144x144.png}">
  <link rel="apple-touch-icon" sizes="152x152" th:href="@{/img/apple-icon-152x152.png}">
  <link rel="apple-touch-icon" sizes="180x180" th:href="@{/img/apple-icon-180x180.png}">
  <link rel="icon" sizes="192x192" th:href="@{/img/android-icon-192x192.png}" type="image/png}">
  <link rel="icon" sizes="32x32" th:href="@{/img/favicon-32x32.png}" type="image/png}">
  <link rel="icon" sizes="96x96" th:href="@{/img/favicon-96x96.png}" type="image/png}">
  <link rel="icon" sizes="16x16" th:href="@{/img/favicon-16x16.png}" type="image/png}">
  <meta content="#ffffff" name="msapplication-TileColor">
  <meta name="msapplication-TileImage" th:content="@{/img/ms-icon-144x144.png}">
  <meta content="#ffffff" name="theme-color">

  <title>Gerador de certificados shizen tabajara</title>
</head>

<body>
<div class="container">
  <div class="row h-45">
    <div class="col-sm-12 my-auto">
      <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
        <li class="nav-item">
          <a aria-controls="pills-home" aria-selected="true" class="nav-link active" data-toggle="pill" href="#pills-home"
             id="pills-home-tab" role="tab">Gerar tudo</a>
        </li>
        <li class="nav-item">
          <a aria-controls="pills-profile" aria-selected="false" class="nav-link" data-toggle="pill" href="#pills-profile"
             id="pills-profile-tab" role="tab">Reenviar e-mails</a>
        </li>
      </ul>
      <div class="tab-content" id="pills-tabContent">
        <div aria-labelledby="pills-home-tab" class="tab-pane fade show active" id="pills-home" role="tabpanel">
          <form action="#" class="well form-horizontal" id="cert-form" method="post" th:action="@{/doAction}"
                th:object="${googleForm}">
            <div class="form-group row">
              <label class="col-sm-6 col-form-label" for="inputFormAnswersName">Nome da planilha com respostas do
                exame</label>
              <div class="col-sm-6">
                <input class="form-control" id="inputFormAnswersName" th:field="*{formAnswersName}"
                       th:value="${formAnswersName}" type="text">
              </div>
            </div>
            <div class="form-group row">
              <label class="col-sm-6 col-form-label" for="inputControlFileName">Nome da planilha com controle dos
                certificados emitidos</label>
              <div class="col-sm-6">
                <input class="form-control" id="inputControlFileName" th:field="*{controlFileName}"
                       th:value="${controlFileName}" type="text">
              </div>
            </div>
            <div class="form-group row">
              <label class="col-sm-6 col-form-label" for="inputCertificateTemplate">
                Nome do documento word que serve de modelo para o certificado</label>
              <div class="col-sm-6">
                <input class="form-control" id="inputCertificateTemplate" th:field="*{certificateTemplate}"
                       th:value="${certificateTemplate}" type="text">
              </div>
            </div>
            <div class="form-group row">
              <label class="col-sm-6 col-form-label" for="inputEmailTemplateName">Nome do documento html que serve de
                modelo para o email</label>
              <div class="col-sm-6">
                <input class="form-control" id="inputEmailTemplateName" th:field="*{emailTemplateName}"
                       th:value="${emailTemplateName}" type="text">
              </div>
            </div>
            <div class="form-group row">
              <label class="col-sm-6 col-form-label" for="inputTempPath">Diretório para criar os certificados</label>
              <div class="col-sm-6">
                <input class="form-control" id="inputTempPath" th:field="*{tempPath}" th:value="${tempPath}"
                       type="text">
              </div>
            </div>
            <!-- Button -->
            <div class="form-group">
              <label class="col-lg-12 control-label"/>
              <div class="col-lg-12">
                <button class="btn btn-primary btn-lg btn-block" id="cert-btn" type="submit">
                  Começar emissão dos certificados
                </button>
              </div>
            </div>
          </form>
        </div>
        <div aria-labelledby="pills-profile-tab" class="tab-pane fade" id="pills-profile" role="tabpanel">e-mails
        </div>
      </div>
    </div>
  </div>
  <div class="row h-05">
    <div class="progress col-sm-12">
      <div aria-valuemax="100" aria-valuemin="0" aria-valuenow="0" class="progress-bar" id="progressbar"
           role="progressbar" style="width: 0%;">0%
      </div>
    </div>
  </div>
  <div class="row h-50">
    <textarea class="w-100 h-auto" id="logsaqui"></textarea>
  </div>
</div>
<!-- Optional JavaScript -->
<!-- jQuery first, then Popper.js, then Bootstrap JS -->
<!--<script type="text/javascript" src="webjars/jquery/3.5.1/jquery.js"></script>-->
<script crossorigin="anonymous" integrity="sha256-QWo7LDvxbWT2tbbQ97B53yJnYU3WhH/C8ycbRAkjPDc="
        src="https://code.jquery.com/jquery-3.5.1.js"></script>
<script crossorigin="anonymous" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN"
        src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV"
        src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script th:src="@{/js/main.js}" type="text/javascript"></script>
</body>

</html>
