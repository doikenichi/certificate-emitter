databaseChangeLog:
  - changeSet:
      id: 004-insert-certificate-exam-quiz
      author: certificate-emitter
      changes:
        - insert:
            tableName: quiz
            columns:
              - column:
                  name: quiz_id
                  valueNumeric: "1"
              - column:
                  name: name
                  value: final certificate exam
              - column:
                  name: description
                  value: final certificate exam of shiatsu course
      rollback:
        - delete:
            tableName: quiz
            where: quiz_id = 1

  - changeSet:
      id: 004-insert-certificate-exam-question-001
      author: certificate-emitter
      changes:
        - insert:
            tableName: question
            columns:
              - column:
                  name: question_id
                  valueNumeric: "1"
              - column:
                  name: quiz_id
                  valueNumeric: "1"
              - column:
                  name: question
                  value: What does the word "Shiatsu" literally mean?
              - column:
                  name: option_a
                  value: Energy healing
              - column:
                  name: option_b
                  value: Finger pressure
              - column:
                  name: option_c
                  value: Body stretching
              - column:
                  name: option_d
                  value: Gentle massage
              - column:
                  name: correct_answer
                  value: b
      rollback:
        - delete:
            tableName: question
            where: question_id = 1

  - changeSet:
      id: 004-insert-certificate-exam-question-002
